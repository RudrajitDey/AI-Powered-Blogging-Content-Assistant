{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<style>
    .login-page {
        width: 100%;
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        background: #f8fafc;
    }

    .login-card {
        width: 100%;
        max-width: 450px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 35px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
    }

    .login-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .login-header h3 {
        margin: 0 0 8px;
        color: #111827;
        font-size: 28px;
        font-weight: 800;
    }

    .login-header span {
        color: #6b7280;
        font-size: 14px;
    }

    .login-form {
        width: 100%;
    }

    .login-form input,
    .login-form select,
    .login-form textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        color: #374151;
        background: #ffffff;
        box-sizing: border-box;
        transition: 0.2s;
    }

    .login-form input:focus,
    .login-form select:focus,
    .login-form textarea:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
    }

    .login-form label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    .login-form .form-group {
        margin-bottom: 18px;
    }

    .login-form .errorlist {
        margin: 5px 0;
        padding-left: 18px;
        color: #dc2626;
        font-size: 13px;
    }

    .login-submit {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border: none;
        border-radius: 8px;
        background: #f59e0b;
        color: #111827;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-submit:hover {
        background: #111827;
        color: #ffffff;
    }

    .login-footer {
        text-align: center;
        margin-top: 22px;
        color: #6b7280;
        font-size: 14px;
    }

    .login-footer a {
        color: #b77900;
        font-weight: 700;
        text-decoration: none;
    }

    .login-footer a:hover {
        color: #111827;
    }

    @media (max-width: 576px) {
        .login-page {
            padding: 30px 15px;
        }

        .login-card {
            padding: 25px 20px;
        }

        .login-header h3 {
            font-size: 24px;
        }
    }
</style>

<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <h3>Welcome Back</h3>
            <span>Login to your DjangoBlog account</span>
        </div>

        <form
            action="{% url 'login' %}"
            method="POST"
            class="login-form"
        >
            {% csrf_token %}

            {{ form|crispy }}

            <button type="submit" class="login-submit">
                Login
            </button>
        </form>

        <div class="login-footer">
            Don't have an account?
            <a href="{% url 'register' %}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
