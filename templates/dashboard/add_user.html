{% extends 'base.html' %}


{% block content %}
{% load crispy_forms_tags %}

<style>
    .dashboard-layout {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px 25px 60px;
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 30px;
    }

    .user-form-page {
        min-width: 0;
        width: 100%;
    }

    .user-form-header {
        margin-bottom: 25px;
    }

    .user-form-header h2 {
        margin: 0;
        color: #111827;
        font-size: 26px;
        font-weight: 800;
    }

    .user-form-card {
        width: 100%;
        max-width: 700px;
        padding: 30px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
    }

    .user-form {
        width: 100%;
    }

    .user-form input,
    .user-form select,
    .user-form textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        background: #ffffff;
        color: #374151;
        font-size: 14px;
        box-sizing: border-box;
        transition: 0.2s ease;
    }

    .user-form input:focus,
    .user-form select:focus,
    .user-form textarea:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
    }

    .user-form label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    .user-form .form-group {
        margin-bottom: 18px;
    }

    .user-form input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
        accent-color: #f59e0b;
    }

    .user-form .help-block,
    .user-form .helptext {
        display: block;
        margin-top: 5px;
        color: #9ca3af;
        font-size: 12px;
    }

    .user-form .errorlist {
        margin: 5px 0;
        padding-left: 18px;
        color: #dc2626;
        font-size: 13px;
    }

    .user-submit {
        margin-top: 5px;
        padding: 11px 25px;
        border: none;
        border-radius: 8px;
        background: #f59e0b;
        color: #111827;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .user-submit:hover {
        background: #111827;
        color: #ffffff;
        transform: translateY(-1px);
    }

    .permission-message {
        padding: 20px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 10px;
        color: #b91c1c;
        font-size: 15px;
        font-weight: 600;
    }

    @media (max-width: 991px) {
        .dashboard-layout {
            grid-template-columns: 1fr;
        }

        .user-form-card {
            max-width: 100%;
        }
    }

    @media (max-width: 767px) {
        .dashboard-layout {
            padding: 20px 15px 40px;
        }

        .user-form-card {
            padding: 20px;
        }

        .user-form-header h2 {
            font-size: 22px;
        }
    }
</style>

<div class="dashboard-layout">
    <!-- Left Sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right Content -->
    <main class="user-form-page">
        {% if perms.auth.add_user %}
            <div class="user-form-header">
                <h2>Add New User</h2>
            </div>

            <div class="user-form-card">
                <form
                    action="{% url 'add_user' %}"
                    method="POST"
                    class="user-form"
                >
                    {% csrf_token %}

                    {{ form|crispy }}

                    <button type="submit" class="user-submit">
                        Submit
                    </button>
                </form>
            </div>
        {% else %}
            <div class="permission-message">
                You do not have permission to view this page.
            </div>
        {% endif %}
    </main>
</div>
{% endblock %}
