{% extends 'base.html' %}


{% block content %}
{% load crispy_forms_tags %}

<style>
    .dashboard-layout {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 30px 25px 60px;
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 30px;
    }

    .post-form-page {
        min-width: 0;
        width: 100%;
    }

    .post-form-header {
        margin-bottom: 25px;
    }

    .post-form-header h2 {
        margin: 0;
        color: #111827;
        font-size: 26px;
        font-weight: 800;
    }

    .post-form-card {
        width: 100%;
        max-width: 800px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
    }

    .post-form {
        width: 100%;
    }

    .post-form input,
    .post-form select,
    .post-form textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        color: #374151;
        background: #ffffff;
        box-sizing: border-box;
        transition: 0.2s;
    }

    .post-form input:focus,
    .post-form select:focus,
    .post-form textarea:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
    }

    .post-form textarea {
        min-height: 180px;
        resize: vertical;
    }

    .post-form label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    .post-form .form-group {
        margin-bottom: 18px;
    }

    .post-form input[type="file"] {
        padding: 9px;
        cursor: pointer;
    }

    .post-form input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
        accent-color: #f59e0b;
    }

    .post-submit {
        display: inline-block;
        padding: 11px 24px;
        border: none;
        border-radius: 8px;
        background: #f59e0b;
        color: #111827;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    .post-submit:hover {
        background: #111827;
        color: #ffffff;
    }

    .post-form .errorlist {
        margin: 5px 0;
        padding-left: 18px;
        color: #dc2626;
        font-size: 13px;
    }

    @media (max-width: 991px) {
        .dashboard-layout {
            grid-template-columns: 1fr;
        }

        .post-form-card {
            max-width: 100%;
        }
    }

    @media (max-width: 767px) {
        .post-form-card {
            padding: 20px;
        }

        .post-form-header h2 {
            font-size: 22px;
        }
    }
</style>

<div class="dashboard-layout">
    <!-- Left Sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right Content -->
    <main class="post-form-page">
        <div class="post-form-header">
            <h2>Add New Post</h2>
        </div>

        <div class="post-form-card">
            <form
                action="{% url 'add_post' %}"
                method="POST"
                enctype="multipart/form-data"
                class="post-form"
            >
                {% csrf_token %}

                {{ form|crispy }}

                <button type="submit" class="post-submit">
                    Submit
                </button>
            </form>
        </div>
    </main>
</div>

{% endblock %}
